# Preregistered analytical decisions.
# These are frozen before test-set analysis. Any change after freezing is
# logged in docs/deviations.md with a date and reason.

study_period:
  start: 2016-01-01
  end: 2024-12-31
  # Final holdout is untouched until model selection completes.
  train_end: 2021-12-31
  validation_end: 2022-12-31
  test_start: 2023-01-01

outcome:
  horizon_days: 14
  baseline_window_weeks: 12
  percentile_cut: 0.90
  # ACLED weeks begin on Saturday. A Monday-aligned grid produces zero overlap
  # and a silently empty panel, so the week anchor is configured rather than
  # assumed.
  week_anchor: W-SAT

  # Two Nigerian outcomes are constructed.
  #
  # primary   serious violence: violence against civilians, battles, riots.
  #           Comparable to conventional conflict-forecasting targets.
  # youth     the subset this study is named for: mob violence, violent
  #           demonstration, abduction, force against protesters, sexual
  #           violence. Excludes most insurgency. Notably, its most affected
  #           locality is the Federal Capital Territory rather than Borno.
  #
  # Thresholds are set from observed base rates on the 2016-2024 ACLED panel.
  # See docs/outcome_calibration.md.
  nigeria:
    primary:
      event_types:
        - Violence against civilians
        - Battles
        - Riots
      min_future_events: 4
      percentile_cut: 0.90
      require_lethal: true
      observed_base_rate: 0.218
    youth:
      sub_event_types:
        - Mob violence
        - Violent demonstration
        - Abduction/forced disappearance
        - Excessive force against protesters
        - Protest with intervention
        - Sexual violence
      min_future_events: 2
      percentile_cut: 0.90
      # Mob violence, abduction and demonstration policing are frequently
      # non-fatal. Requiring a death would discard most of the outcome and
      # reintroduce the insurgency bias this outcome exists to avoid.
      require_lethal: false
      observed_base_rate: 0.170

  # Event types excluded from both outcomes, with reasons.
  excluded_event_types:
    Protests: >
      Overwhelmingly peaceful. Enters the panel as a leading predictor rather
      than an outcome, following the protest-to-conflict literature.
    Strategic developments: >
      Arrests, agreements, headquarters establishment. Not violence.
    Explosions/Remote violence: >
      Air strikes, IEDs and suicide bombing. Almost entirely insurgency and
      counter-insurgency, which is the bias the youth outcome avoids.

  usa:
    require_lethal: false
    combine: and
    offense_codes: [09A, 09B, 13A, 120]
  severe_event:
    min_fatalities: 5

youth:
  # Age is inconsistently observed in Nigerian event data. We do not treat all
  # violence as youth violence where age is unknown. See manuscript limitations.
  usa_age_min: 15
  usa_age_max: 29
  nigeria_protagonist_terms:
    - cult
    - student
    - youth
    - vigilante

completeness:
  # A locality-week enters the main sample only if these hold.
  min_source_coverage: 0.80
  usa_min_agency_reporting_continuity: 0.90
  nigeria_min_geocoded_share: 0.70

alert_budget:
  # k expressed as a share of eligible localities, avoiding the presentation
  # of any single untested institutional capacity as universal.
  k_percentiles: [0.01, 0.02, 0.05, 0.10]
  illustrative_absolute:
    nigeria: 4
    usa: 10
  # Two linked constraints. A release fails if either is breached.
  max_review_burden_per_week: 10
  min_severe_recall: 0.70

service_level_objectives:
  data_freshness_pct: 0.95
  source_completeness_floor: 0.80
  pipeline_success_pct: 0.99
  detection_at_capacity: 0.70
  max_subgroup_recall_gap: 0.10

evaluation:
  primary_metric: average_precision
  bootstrap_draws: 1000
  confidence_level: 0.95
  random_seed: 20260724

failure_experiments:
  # Controlled retrospective degradation. Tests H4 without live deployment.
  gdelt_delay_weeks: [1, 2]
  source_removal: [gdelt_events, nigeria_watch]
  agency_masking_share: [0.10, 0.25, 0.50]
  volume_truncation_share: [0.25, 0.50]
