  base_url: https://hub.worldpop.org
  cadence: annual
  freshness_slo_hours: 8760
  volume_floor: 0.90
  required: false
  schema:
    admin_code: str
    year: int
    total_population: float
    youth_15_29: float

acs:
  setting: usa
  role: structural
  route: api
  base_url: https://api.census.gov/data
  cadence: annual
  freshness_slo_hours: 8760
  volume_floor: 0.90
  required: false
  schema:
    state: str
    county: str
    year: int
    poverty_rate: float
    unemployment_rate: float
    median_income: float
    pop_15_29_share: float

afrobarometer:
  setting: nigeria
  role: structural
  route: export
  base_url: https://www.afrobarometer.org
  cadence: wave
  freshness_slo_hours: 26280
  volume_floor: 0.90
  required: false
  notes: Slow-moving context. Carried forward within the publication interval only.
  schema:
    region: str
    round: int
    year: int
    trust_police: float
    insecurity_perception: float
    unemployment_concern: float

views:
  setting: nigeria
  role: benchmark
  route: api
  base_url: https://api.viewsforecasting.org
  cadence: monthly
  freshness_slo_hours: 1080
  volume_floor: 0.80
  required: false
  notes: >
    Benchmark only. Must never enter the feature matrix. Enforced in
    features/build.py by an explicit exclusion check.
  schema:
    month_id: int
    country_id: int
    step: int
    prediction: float
